<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
</head>
<body>
{% extends 'base.html' %}

{% block content %}

<h2>Cart</h2>

<table class="table">

<tr>

<th>Product</th>
<th>Qty</th>
<th>Price</th>

</tr>

{% for item in items %}

<tr>

<td>{{ item.product.name }}</td>

<td>{{ item.quantity }}</td>

<td>{{ item.product.price }}</td>

</tr>

{% endfor %}

</table>

<a href="/checkout/"
class="btn btn-primary">

Checkout

</a>

{% endblock %}
</body>
</html>
